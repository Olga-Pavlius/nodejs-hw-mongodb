tags:
    - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: Delete contact by its unique identifier.
security:
    - bearerAuth: []
parameters:
    - name: id
      in: path
      required: true
      description: Unique contact identifier
      schema:
        type: string
        example: 507f1f77bcf86cd799439011
responses:
    '200':
      description: Contact deleted successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Contact deleted successfully
    '401':
      $ref: '../../../components/responses/401.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
    '500':
      $ref: '../../../components/responses/500.yaml'
