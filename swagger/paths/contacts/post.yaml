post:
  tags:
    - Contacts
  summary: Create contact
  operationId: createContact
  description: Create a new contact in the address book
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - name
            - phoneNumber
            - contactType
            - userId
          properties:
            name:
              type: string
              description: Name of the contact
              example: Olya
            phoneNumber:
              type: string
              description: Contact number
              example: "+380991234567"
            email:
              type: string
              format: email
              description: Email address
              example: olya@example.com
            isFavourite:
              type: boolean
              description: Whether contact is a favourite
              example: true
              default: false
            contactType:
              type: string
              description: Type of contact
              enum: [work, home, personal]
              example: home
              default: personal
            userId:
              type: string
              format: uuid
              description: ID of the user who owns the contact
              example: 64e54c5a4eac4b0012a5a123
            photo:
              type: string
              format: binary
              description: Optional photo file
  responses:
    '201':
      description: Contact created successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Contact created successfully
              data:
                $ref: ../../../components/schemas/contact.yaml
    '401':
      $ref: ../../../components/responses/401.yaml
    '500':
      $ref: ../../../components/responses/500.yaml
