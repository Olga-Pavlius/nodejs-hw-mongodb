tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    description: Items per page
    schema:
      type: integer
      example: 10
  - name: sortBy
    in: query
    required: false
    description: Sort by field
    schema:
      type: string
      example: contactType
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: false
  - name: contactType
    in: query
    required: false
    schema:
      type: string
      enum: [home, work, personal]
      example: personal
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 4
                totalItems:
                  type: integer
                  example: 15
                totalPages:
                  type: integer
                  example: 4
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
