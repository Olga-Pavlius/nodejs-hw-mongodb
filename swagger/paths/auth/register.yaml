tags:
  - Auth
summary: Register new user
operationId: register
description: Creates a new user account
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            example: MyStrongPassword123
responses:
  '201':
    description: Created user
  '409':
    description: Email already in use
