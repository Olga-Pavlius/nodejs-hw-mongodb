post:
  tags:
    - Auth
  summary: User login
  operationId: loginUser
  description: Authenticate user by email and password.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: olya@example.com
            password:
              type: string
              format: password
              example: MyStrongPassword123
 responses:
    '200':
      description: Successful login
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Login successful
              data:
                type: object
                required:
                  - accessToken
                  - refreshToken
                properties:
                  accessToken:
                    type: string
                    example: your-access-token
                  refreshToken:
                    type: string
                    example: your-refresh-token
    '401':
      description: Incorrect email or password
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Incorrect email or password
