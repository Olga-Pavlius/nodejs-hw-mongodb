post:
  tags:
    - Auth
  summary: User logout
  operationId: logoutUser
  description: Ends the user's session and invalidates tokens.
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Session ended successfully
    '401':
      description: User is not authorized
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized access
